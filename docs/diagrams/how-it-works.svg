<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1204" viewBox="0 46 1440 1204" role="img" aria-labelledby="title description">
  <title id="title">How Delivery Insights works</title>
  <desc id="description">An arq worker pulls pull request information from GitHub with read-only access and writes it to Postgres. The worker also precomputes default reports and expires old data; it uses Redis for jobs, repository locks and report caches. The React dashboard, served by nginx, gets its data from FastAPI through a same-origin /api proxy. FastAPI reads and stores local reports in Postgres and uses Redis for caches, the narrative lock and rate limits. For a narrative, FastAPI builds an evidence pack from the snapshot and scores two hypotheses, then looks for a stored narrative in Redis and Postgres. On a miss, one request per snapshot holds a lock and sends only the evidence pack to Bedrock Converse. A local validator checks the reply; an invalid reply gets one repair attempt. A local deterministic template is used when the LLM is disabled or still busy, when Bedrock is unavailable or times out, and when the reply remains invalid. Validated wording or template wording is assembled with the scored hypotheses, stored, and returned to the dashboard.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#94a8b8"/>
    </marker>
    <marker id="success-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#7bd9bd"/>
    </marker>
    <marker id="repair-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#91baff"/>
    </marker>
    <marker id="fallback-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#e9bd79"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .section { fill: #dce8ee; font-size: 21px; font-weight: 600; }
      .number { fill: #7bd9bd; font-size: 15px; font-weight: 700; letter-spacing: 2px; }
      .muted { fill: #acbdc8; font-size: 15px; }
      .node { fill: #26333e; stroke: #587080; stroke-width: 1.5; }
      .external { fill: #35304c; stroke: #c4adff; stroke-width: 2; }
      .processing { fill: #253951; stroke: #91baff; stroke-width: 2; }
      .storage { fill: #203c43; stroke: #64cbd8; stroke-width: 2; }
      .storage-rim { fill: none; stroke: #64cbd8; stroke-width: 1.5; }
      .presentation { fill: #223c36; stroke: #7bd9bd; stroke-width: 2; }
      .validation-fallback { fill: #383327; stroke: #e9bd79; stroke-width: 2; }
      .node-title { fill: #f0f5f8; font-size: 20px; font-weight: 600; text-anchor: middle; }
      .node-detail { fill: #b7c8d2; font-size: 14px; text-anchor: middle; }
      .edge { fill: none; stroke: #94a8b8; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; marker-end: url(#arrow); }
      .both { marker-start: url(#arrow); }
      .success { stroke: #7bd9bd; marker-end: url(#success-arrow); }
      .repair { stroke: #91baff; marker-end: url(#repair-arrow); }
      .fallback { stroke: #e9bd79; stroke-dasharray: 7 6; marker-end: url(#fallback-arrow); }
      .label { fill: #c1d0d9; font-size: 14px; text-anchor: middle; }
      .success-label { fill: #7bd9bd; }
      .repair-label { fill: #91baff; }
      .fallback-label { fill: #e9bd79; }
    </style>
  </defs>

  <rect y="46" width="1440" height="1204" rx="18" fill="#161e25"/>
  <text class="muted" x="40" y="84">Local data powers the dashboard. Structured evidence powers the narrative.</text>

  <rect x="30" y="106" width="1380" height="400" rx="16" fill="#1e2932" stroke="#344653"/>
  <text class="number" x="60" y="148">01</text>
  <text class="section" x="105" y="148">Data sync and local reporting</text>

  <g id="github-worker">
    <path class="edge" d="M 340 250 H 510"/>
    <text class="label" x="425" y="216"><tspan x="425">Read-only access</tspan><tspan x="425" dy="19">Pull PR info</tspan></text>
  </g>
  <g id="worker-postgres">
    <path class="edge" d="M 770 250 H 1120"/>
    <text class="label" x="945" y="233">Raw records, facts and precomputed reports</text>
  </g>
  <g id="worker-redis">
    <path class="edge both" d="M 640 210 V 190 H 1390 V 440 H 1360"/>
    <text class="label" x="1015" y="181">Jobs, repo locks and report caches</text>
  </g>
  <g id="api-web">
    <path class="edge" d="M 510 435 H 340"/>
    <text class="label" x="425" y="420">Same-origin /api</text>
  </g>
  <g id="api-postgres">
    <path class="edge both" d="M 770 415 H 810 V 330 H 1240 V 296"/>
    <text class="label" x="1025" y="318">Local reads and stored reports</text>
  </g>
  <g id="api-redis">
    <path class="edge both" d="M 770 455 H 1120"/>
    <text class="label" x="945" y="443">Caches, narrative lock and rate limits</text>
  </g>

  <g id="github">
    <rect class="node external" x="60" y="210" width="280" height="80" rx="12"/>
    <text class="node-title" x="200" y="245">GitHub</text>
    <text class="node-detail" x="200" y="270">GraphQL API</text>
  </g>
  <g id="worker">
    <rect class="node processing" x="510" y="210" width="260" height="80" rx="12"/>
    <text class="node-title" x="640" y="245">Worker · arq</text>
    <text class="node-detail" x="640" y="270">Sync, derive and precompute</text>
  </g>
  <g id="postgres">
    <path class="node storage" d="M 1120 220 C 1120 200 1360 200 1360 220 V 280 C 1360 300 1120 300 1120 280 Z"/>
    <path class="storage-rim" d="M 1120 220 C 1120 240 1360 240 1360 220"/>
    <text class="node-title" x="1240" y="260">Postgres</text>
    <text class="node-detail" x="1240" y="282">Raw data, facts and reports</text>
  </g>
  <g id="web">
    <rect class="node presentation" x="60" y="400" width="280" height="80" rx="12"/>
    <text class="node-title" x="200" y="435">React · nginx</text>
    <text class="node-detail" x="200" y="460">Dashboard</text>
  </g>
  <g id="api">
    <rect class="node processing" x="510" y="400" width="260" height="80" rx="12"/>
    <text class="node-title" x="640" y="435">FastAPI</text>
    <text class="node-detail" x="640" y="460">Local queries and reports</text>
  </g>
  <g id="redis">
    <path class="node storage" d="M 1120 410 C 1120 390 1360 390 1360 410 V 470 C 1360 490 1120 490 1120 470 Z"/>
    <path class="storage-rim" d="M 1120 410 C 1120 430 1360 430 1360 410"/>
    <text class="node-title" x="1240" y="449">Redis</text>
    <text class="node-detail" x="1240" y="473">Caches, locks, limits and jobs</text>
  </g>

  <rect x="30" y="526" width="1380" height="574" rx="16" fill="#1e2932" stroke="#344653"/>
  <text class="number" x="60" y="568">02</text>
  <text class="section" x="105" y="568">Narrative generation</text>
  <text class="muted" x="60" y="596">Code computes every number and scores the hypotheses; Bedrock only words them. Everything except Bedrock runs inside FastAPI.</text>

  <g id="evidence-cache">
    <path class="edge" d="M 340 680 H 440"/>
    <text class="label" x="390" y="652"><tspan x="390">Keyed by</tspan><tspan x="390" dy="18">pack hash</tspan></text>
  </g>
  <g id="cache-response">
    <path class="edge success" d="M 700 680 H 1120"/>
    <text class="label success-label" x="910" y="668">Hit: stored narrative</text>
  </g>
  <g id="cache-lock">
    <path class="edge" d="M 500 731 V 775 H 185 V 820"/>
    <text class="label" x="340" y="766">Miss</text>
  </g>
  <g id="lock-bedrock">
    <path class="edge" d="M 310 865 H 400"/>
    <text class="label" x="355" y="836"><tspan x="355">Evidence</tspan><tspan x="355" dy="17">pack only</tspan></text>
  </g>
  <g id="bedrock-validator">
    <path class="edge" d="M 650 865 H 740"/>
    <text class="label" x="695" y="836"><tspan x="695">Generated</tspan><tspan x="695" dy="17">wording</tspan></text>
  </g>
  <g id="validator-repair">
    <path class="edge repair" d="M 865 820 V 780 H 600 V 820"/>
    <text class="label repair-label" x="732" y="770">Invalid: one repair with the violations</text>
  </g>
  <g id="validator-assemble">
    <path class="edge success" d="M 990 865 H 1080"/>
    <text class="label success-label" x="1035" y="852">Valid</text>
  </g>
  <g id="assemble-response">
    <path class="edge success" d="M 1230 820 V 730"/>
    <text class="label success-label" x="1310" y="780">Store and serve</text>
  </g>
  <g id="validator-template">
    <path class="edge fallback" d="M 865 910 V 990"/>
    <text class="label fallback-label" x="930" y="955">Still invalid</text>
  </g>
  <g id="bedrock-template">
    <path class="edge fallback" d="M 525 910 V 1020 H 740"/>
    <text class="label fallback-label" x="632" y="1008">Unavailable / timeout</text>
  </g>
  <g id="lock-template">
    <path class="edge fallback" d="M 185 910 V 1058 H 740"/>
    <text class="label fallback-label" x="460" y="1046">LLM disabled, or still busy after waiting</text>
  </g>
  <g id="template-assemble">
    <path class="edge success" d="M 990 1032 H 1230 V 910"/>
    <text class="label success-label" x="1110" y="1020">Template wording</text>
  </g>

  <g id="evidence">
    <rect class="node processing" x="60" y="630" width="280" height="100" rx="12"/>
    <text class="node-title" x="200" y="666">Evidence and scoring</text>
    <text class="node-detail" x="200" y="691">Evidence pack from the snapshot</text>
    <text class="node-detail" x="200" y="712">Review capacity · PR size growth</text>
  </g>
  <g id="cache">
    <path class="node storage" d="M 440 650 C 440 630 700 630 700 650 V 710 C 700 730 440 730 440 710 Z"/>
    <path class="storage-rim" d="M 440 650 C 440 670 700 670 700 650"/>
    <text class="node-title" x="570" y="692">Narrative cache</text>
    <text class="node-detail" x="570" y="714">Redis, then Postgres</text>
  </g>
  <g id="response">
    <rect class="node processing" x="1120" y="630" width="260" height="100" rx="12"/>
    <text class="node-title" x="1250" y="673">FastAPI response</text>
    <text class="node-detail" x="1250" y="698">Narrative and ETag to the dashboard</text>
  </g>
  <g id="lock">
    <rect class="node processing" x="60" y="820" width="250" height="90" rx="12"/>
    <text class="node-title" x="185" y="858">Generation lock</text>
    <text class="node-detail" x="185" y="883">One request per snapshot</text>
  </g>
  <g id="bedrock">
    <rect class="node external" x="400" y="820" width="250" height="90" rx="12"/>
    <text class="node-title" x="525" y="858">AWS Bedrock</text>
    <text class="node-detail" x="525" y="883">Converse · submit_narrative</text>
  </g>
  <g id="validator">
    <rect class="node validation-fallback" x="740" y="820" width="250" height="90" rx="12"/>
    <text class="node-title" x="865" y="858">Local validator</text>
    <text class="node-detail" x="865" y="883">Numbers, citations, hedges</text>
  </g>
  <g id="assemble">
    <rect class="node processing" x="1080" y="820" width="300" height="90" rx="12"/>
    <text class="node-title" x="1230" y="858">Assemble and store</text>
    <text class="node-detail" x="1230" y="883">Scored hypotheses + wording</text>
  </g>
  <g id="template">
    <rect class="node validation-fallback" x="740" y="990" width="250" height="85" rx="12"/>
    <text class="node-title" x="865" y="1022">Local deterministic</text>
    <text class="node-title" x="865" y="1052">template</text>
  </g>

  <text class="muted" x="40" y="1135">Bedrock never sees PR titles, bodies, comments or logins. Template wording skips the validator; it follows the same rules by construction.</text>
  <text class="muted" x="40" y="1160">Postgres keeps validated LLM narratives and disabled-LLM templates; other fallbacks stay in Redis for at most 5 minutes so the LLM is retried.</text>
  <g id="module-legend" aria-label="Module colors grouped by responsibility">
    <text class="muted" x="40" y="1195">Module groups</text>
    <rect class="external" x="60" y="1209" width="18" height="18" rx="4"/>
    <text class="muted" x="90" y="1224">External services</text>
    <rect class="processing" x="320" y="1209" width="18" height="18" rx="4"/>
    <text class="muted" x="350" y="1224">Processing</text>
    <rect class="storage" x="560" y="1209" width="18" height="18" rx="4"/>
    <text class="muted" x="590" y="1224">Data and queues</text>
    <rect class="validation-fallback" x="810" y="1209" width="18" height="18" rx="4"/>
    <text class="muted" x="840" y="1224">Validation and fallback</text>
    <rect class="presentation" x="1150" y="1209" width="18" height="18" rx="4"/>
    <text class="muted" x="1180" y="1224">Presentation</text>
  </g>
</svg>
