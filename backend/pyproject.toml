[project]
name = "delivery-insights"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "boto3>=1.40",
  "numpy>=2.0",
  "orjson>=3.10",
  "structlog>=24.1",
]
[dependency-groups]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "respx>=0.21",
  "testcontainers[postgres,redis]>=4.4", "ruff>=0.5", "mypy>=1.10",
  "boto3-stubs[bedrock-runtime]>=1.40"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/insights", "eval/insights_eval"]
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "eval", "tests"]
[tool.ruff.lint]
allowed-confusables = ["×", "–"]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "ASYNC", "PTH", "N", "C4", "PIE", "RET", "D1"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
# Test names state what each test checks; a docstring would only repeat them.
"tests/**/test_*.py" = ["D103"]
"eval/**" = ["S311"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["src", "eval"]
packages = ["insights", "insights_eval"]
[[tool.mypy.overrides]]
module = ["arq.*", "testcontainers.*"]
ignore_missing_imports = true
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: needs Docker (testcontainers)"]
addopts = "-ra --strict-markers"
